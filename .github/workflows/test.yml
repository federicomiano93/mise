name: Tests

# The owner cannot review code, so these automated tests are the main safety net
# against regressions (P15). They run on every push and pull request.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # No install step: the suite is pure Node with zero dependencies, run by the
      # built-in test runner (`node --test`, see package.json).
      - run: npm test

  # The security rules are the app's ONLY boundary between two businesses sharing
  # one database, and until now their suite ran only when somebody remembered to
  # run it by hand. It needs the Firebase emulator, so it cannot ride in the job
  # above (`node --test` deliberately does not discover tests/rules/*.mjs).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # The Firestore emulator is a Java program. 21 is the current LTS and the
      # version this was verified on locally.
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # The emulator jars are downloaded on first use (~100 MB) and never change
      # for a given firebase-tools release, so they are cached against the pinned
      # version. A cache miss only costs time, never correctness.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.26.0

      # PINNED ON PURPOSE. firebase-tools ships the emulator itself, so an
      # unpinned `@latest` would silently change the thing under test between two
      # runs of the same commit — a red build nobody changed anything to cause,
      # and the opposite of what a safety net is for. 15.26.0 is the version the
      # checks were verified against locally before this workflow was written.
      # Raise it deliberately, and re-run the suite locally when you do.
      - run: npm install --global firebase-tools@15.26.0

      # --project demo-theitalianclub: firebase-tools treats a `demo-` prefix as
      # offline-only — it looks for no credentials and can reach no real Firebase
      # project, so CI cannot touch production even by accident. The harness
      # defaults to the same id (tests/rules/seed-emulator.mjs).
      - run: firebase emulators:exec --only auth,firestore --project demo-theitalianclub "npm run test:rules"

  # ── The server half of the notifications ────────────────────────────────────
  #
  # ⚠️ `needs: [test, rules]` IS THE ENTIRE GUARANTEE OF THIS JOB, and it is the
  # reason it exists at all. `firebase deploy --only functions` publishes whatever
  # is on the machine it runs on — run by hand, it walks straight past the branch
  # protection and the two suites above, which is the one thing this project has
  # protected for two years. Here it cannot run until both are green.
  #
  # ⚠️ AND ONLY ON main, ONLY ON A PUSH. A pull request from anywhere must never
  # be able to publish code to the live project.
  deploy-functions:
    needs: [test, rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # ⚠️ NO DOWNLOADABLE KEY EXISTS ANYWHERE. GitHub proves who it is with a token
    # it mints for this run, Google checks that claim and hands back a credential
    # that lasts minutes. Nothing permanent is stored here, in the repo, or on
    # anybody's laptop — so there is nothing to leak, nothing to rotate, and
    # nothing that keeps working after it has been stolen. It is what Google's own
    # warning on the "create key" page asks for.
    #
    # ⚠️ `id-token: write` IS WHAT MAKES IT POSSIBLE, and `contents: read` is what
    # keeps the rest of the token small. Both are needed: without the first the
    # exchange fails, and without naming them at all the job would get the default
    # broad set for nothing.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ⚠️ THE TRUST IS PINNED TO THIS REPOSITORY, on Google's side, in TWO
      # PLACES. Both must name it or the exchange fails:
      #   1. the provider's attribute condition —
      #        assertion.repository == 'federicomiano93/mise_app'
      #   2. the service account's own IAM policy, which is what lets that
      #      repository impersonate it —
      #        …/attribute.repository/federicomiano93/mise_app
      # Without them ANY repository on GitHub could ask for, and get, a credential
      # to this project. It is the whole security model of this job and it does
      # not live in this file — read both with:
      #   gcloud iam workload-identity-pools providers describe github-provider \
      #     --location=global --workload-identity-pool=github-pool
      #   gcloud iam service-accounts get-iam-policy \
      #     github-deploy@bakery-app-ebf90.iam.gserviceaccount.com
      #
      # ⚠️ RENAMING THE REPOSITORY BREAKS THIS JOB, and this comment used to name
      # only place 1. On 13 Aug 2026 the_italian_club_app became mise_app, place 1
      # was repointed, and the deploy went on failing — the error names neither
      # place, so the second was found only by looking for it. Every push to main
      # failed for hours while `test` and `rules` stayed green, so the failure
      # e-mail said "Tests" and the tests were never the problem.
      #
      # ⚠️ EACH MUST NAME EXACTLY ONE REPOSITORY. Adding the new name beside the
      # old one is the tempting way to make a rename painless, and it leaves the
      # abandoned repository able to deploy to this project for ever.
      - name: Sign in to Google (no key)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: bakery-app-ebf90
          workload_identity_provider: projects/27778450817/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@bakery-app-ebf90.iam.gserviceaccount.com

      # Reproducible: the lockfile decides, not whatever npm feels like today.
      - name: Install
        run: npm ci
        working-directory: functions

      # ⚠️ `--audit-level=high` ON PURPOSE, AND THIS IS A JUDGEMENT WORTH RE-READING.
      # The install carries 8 MODERATE advisories, every one of them the same
      # `uuid` buffer-bounds issue reached through Google's own dependency chain
      # inside firebase-admin. There is no fixed version — the newest release has
      # the same class — and nothing here ever calls uuid. Failing on moderate
      # would make this job permanently red for something nobody can fix, which
      # teaches people to ignore it. A HIGH or CRITICAL still stops the deploy.
      # Revisit when firebase-admin ships a clean tree.
      - name: Vulnerability check (P11)
        run: npm audit --audit-level=high
        working-directory: functions

      - name: Deploy
        run: |
          npm install --global firebase-tools@15.26.0
          firebase deploy --only functions --project bakery-app-ebf90 --non-interactive
