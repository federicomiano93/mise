<!--
  THE ITALIAN CLUB PWA — Home
  Landing screen: one card per section (Calculator, Recipe catalogue, Orders,
  Pastries). A location that does not use a section has its card REMOVED here by
  js/home-session.js, so this markup is the full set, not what any one venue sees.
  start_url of the PWA (see manifest.json). Reuses style.css; new styles in orders.css.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  CSP bootstrap. A <meta> Content-Security-Policy cannot be loosened at runtime
  (multiple policies combine by intersection), so to allow the LOCAL Firebase
  emulator on localhost WITHOUT touching the live site's policy, the meta is
  emitted here. On the live domain the string is byte-identical to the production
  policy; on localhost only, connect-src additionally allows the Auth (9099) and
  Firestore (8080) and Functions (5001) emulators.
  ⚠️ THE FUNCTIONS ORIGIN HAD TO BE ADDED TO THE LIVE POLICY TOO. Until the
  onboarding calls, nothing in this app ever called a Cloud Function from a
  browser — the existing ones are triggered by Firestore, server to server — so
  connect-src had never needed it. Without it every callable fails with the
  client's generic 'internal', which says nothing about a blocked request. This inline script runs before any CSP is in effect
  (only <meta charset> precedes it) and before any network request.
-->
<script>
(function () {
  var local = ['localhost', '127.0.0.1', '::1', '[::1]'].indexOf(location.hostname) !== -1;
  var emu = local
    ? ' http://localhost:8080 http://localhost:9099 http://localhost:5001 http://127.0.0.1:8080 http://127.0.0.1:9099 http://127.0.0.1:5001'
    : '';
  document.write(
    '<meta http-equiv="Content-Security-Policy" content="' +
    "default-src 'self'; " +
    "script-src 'self' https://www.gstatic.com https://www.google.com; " +
    "connect-src 'self' https://www.gstatic.com https://www.google.com https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://us-central1-bakery-app-ebf90.cloudfunctions.net" + emu + "; " +
    "frame-src 'self' https://www.google.com; " +
    "img-src 'self' data:; " +
    "style-src 'self'; " +
    "font-src 'self'; " +
    // Neither is covered by default-src, so both have to be stated. base-uri stops
    // an injected <base> from re-pointing every relative URL on the page; the app
    // has no <form> at all, so form-action 'self' can only ever refuse something
    // that should not be there.
    "base-uri 'self'; " +
    "form-action 'self'" +
    '">'
  );
})();
</script>
<!-- Splash gate: decide (before first paint) whether to show the Home splash.
     Render-blocking classic script so <html>.no-splash is set before <body>. -->
<script src="js/splash-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Misé — the back-of-house app for bakeries and kitchens: dough calculator, recipe catalogue and supplier orders.">
<meta name="theme-color" content="#2D5016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Misé">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="orders.css">
<title>Misé</title>
</head>
<body>

<!-- Sign-in cover. It is HERE, in the markup, so it is opaque from the first
     paint: the app must never flash a location's data at whoever is holding
     the phone. js/auth-gate.js fills it in and removes it once a location is
     open. -->
<div id="auth-gate" class="auth-gate"></div>

<!-- Splash overlay: shown instantly on open, faded out by boot.js once ready.
     Styles live in orders.css and hide logic in js/orders/boot.js (CSP forbids
     inline style/script). Decorative only — aria-hidden so screen readers skip it. -->
<div id="splash" class="splash" aria-hidden="true">
  <img src="icons/icon-512.png" alt="" class="splash-logo" width="160" height="160">
</div>

<header class="home-header">
  <!-- Up one level, to the list of every venue this account has.
       ⚠️ HIDDEN BY DEFAULT AND REVEALED BY js/home-session.js, never built on the
       fly: it must exist in the markup so it can be shown without a repaint, and it
       must start hidden so somebody with a single venue never sees it flash. Same
       pattern, and the same reason, as the Orders "Clear quantities" button (v215).
       [hidden] is forced to display:none in tokens.css, so this really is hidden. -->
  <!-- ⚠️ IT CARRIES .overlay-back-btn, THE SHARED CLASS. style.css says in as many
       words that this is the one to use on anything new: a screen that invents its
       own Back button gets a bare glyph where every other screen has the round
       translucent circle, and Federico spotted exactly that the last time it
       happened. .home-up-btn only adjusts what this header needs. -->
  <button id="home-up-btn" class="overlay-back-btn home-up-btn" type="button"
          aria-label="All my businesses" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div>
    <!-- Replaced with the location's own name once a location is open
         (js/location-title.js). The text here is only what a browser shows
         before the app runs, behind the sign-in cover. -->
    <h1 data-location-title>Misé</h1>
    <p data-i18n="ui.home">Home</p>
  </div>
  <!-- The "?" — js/help-button.js fills this. The page says WHERE it goes, because
       every header in this app is built differently and a module that guessed would
       push a centred title off centre somewhere. -->
  <span class="help-host" data-help="home"></span>
</header>

<div class="scroll-area home-scroll">

  <!-- Once-a-day "order to place today" reminder, filled by js/home-orders-badge.js.
       Empty (and hidden) when no order is due or it has already shown today. -->
  <div id="home-reminder"></div>

  <nav class="home-grid" aria-label="Main sections">

    <a class="home-card" href="calculator.html" data-section="calculator">
      <span class="home-card-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="3" width="14" height="18" rx="2"/>
          <path d="M8 7h8M8 11h2M11 11h2M14 11h2M8 15h2M11 15h2M14 15v2"/>
        </svg>
      </span>
      <span class="home-card-title" data-i18n="section.calculator">Calculator</span>
      <span class="home-card-sub" data-i18n="ui.doughScaling">Dough scaling</span>
    </a>

    <a class="home-card" href="catalogue.html" data-section="catalogue">
      <span class="home-card-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/>
          <path d="M4 21V5.5"/>
          <path d="M9 7.5h7M9 11h5"/>
        </svg>
      </span>
      <span class="home-card-title" data-i18n="section.catalogue">Recipe catalogue</span>
      <span class="home-card-sub" data-i18n="ui.recipesKgScaling">Recipes &amp; kg scaling</span>
    </a>

    <a class="home-card" href="orders.html" data-section="orders">
      <span class="home-card-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4h6a1 1 0 0 1 1 1v0a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v0a1 1 0 0 1 1-1z"/>
          <path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <path d="M9 11h6M9 15h6"/>
        </svg>
      </span>
      <span class="home-card-title" data-i18n="section.orders">Orders</span>
      <span class="home-card-sub" data-i18n="ui.thisWeeksOrder">This week’s order</span>
    </a>

    <!-- ⚠️ data-section="orders", THE SAME NAME AS THE CARD ABOVE, and that is the
         whole access story. These records ARE the Orders feature's data, so the two
         cards appear and disappear together (js/home-session.js filters on this
         attribute) and NO new section name had to be invented — adding one to
         js/sections.js SECTIONS switches it ON for every venue that already exists.
         ⚠️ AND NO ROLE GATE. The records were open to everybody in the location when
         they lived behind the gear, deliberately: correcting a supplier's phone
         number is ordinary work, and the ingredient screen behind this one is where
         the allergens are — the one screen in this app that can send somebody to
         hospital. Only Delete is gated, inside.
         ⚠️ AND THE TITLE IS THE LONG KEY, NOT section.suppliers. Behind this card
         sit TWO lists, and the one that matters right now is the second — every
         ingredient, with its allergens. «Fornitori» alone never said so. The short
         key stays on the Orders bottom bar, where three buttons share a 320px
         phone and this label would wrap it. -->
    <a class="home-card" href="suppliers.html" data-section="orders">
      <span class="home-card-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l1.5-4A1 1 0 0 1 5.45 4h13.1a1 1 0 0 1 .95.68L21 9"/>
          <path d="M3 9h18v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
          <path d="M9 13h6"/>
        </svg>
      </span>
      <span class="home-card-title" data-i18n="section.suppliersAndIngredients">Suppliers &amp; ingredients</span>
      <span class="home-card-sub" data-i18n="ui.contactsAndAllergens">Contacts &amp; allergens</span>
    </a>

    <a class="home-card" href="pastries.html" data-section="pastries">
      <span class="home-card-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 16h17v2.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
          <path d="M6 16a2.75 2.75 0 0 1 5.5 0"/>
          <path d="M12.5 16a3.25 3.25 0 0 1 6.5 0"/>
        </svg>
      </span>
      <span class="home-card-title" data-i18n="section.pastries">Pastries</span>
      <span class="home-card-sub" data-i18n="ui.toProveForTomorrow">To prove for tomorrow</span>
    </a>

    <a class="home-card" href="foodcost.html" data-section="foodcost">
      <span class="home-card-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V10"/>
          <path d="M10 20V4"/>
          <path d="M16 20v-7"/>
          <path d="M3 20h18"/>
        </svg>
      </span>
      <span class="home-card-title" data-i18n="section.foodcost">Food cost</span>
      <span class="home-card-sub" data-i18n="ui.productsMargins">Products &amp; margins</span>
    </a>

  </nav>
  <div id="install-host" class="install-host"></div>

  <!-- Log out lives down here, last and quiet: it is the one action on this
       screen nobody comes to the app to perform (P20). The location name stays
       at the top, where it answers "where am I writing?" before you tap. -->
  <div id="session-logout-host"></div>
</div>

<script type="module" src="js/i18n-dom.js"></script>
<script type="module" src="js/auth-gate.js"></script>
<script type="module" src="js/sw-update.js"></script>
<script type="module" src="js/orders/boot.js"></script>
<!-- "What's new" after an update. Home only, and it waits for boot.js above to
     take the splash down before it opens. -->
<script type="module" src="js/whats-new-boot.js"></script>
  <script type="module" src="js/install-version-boot.js"></script>
<script type="module" src="js/location-title.js"></script>
<script type="module" src="js/home-session.js"></script>
<script type="module" src="js/home-orders-badge.js"></script>
<script type="module" src="js/help-button.js"></script>
<script type="module" src="js/home-client-orders-badge.js"></script>
<script type="module" src="js/home-order-requests-badge.js"></script>
<script type="module" src="js/hold-to-zoom.js"></script>
<script type="module" src="js/install.js"></script>
</body>
</html>
