<!--
  THE ITALIAN CLUB PWA — Recipe catalogue
  Searchable recipe library; view a recipe, scale it by total weight in kg,
  add/edit/delete recipes, and import a recipe into the Calculator.
  All logic lives in js/catalogue/* (loaded via catalogue-main.js).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  CSP bootstrap. A <meta> Content-Security-Policy cannot be loosened at runtime
  (multiple policies combine by intersection), so to allow the LOCAL Firebase
  emulator on localhost WITHOUT touching the live site's policy, the meta is
  emitted here. On the live domain the string is byte-identical to the production
  policy; on localhost only, connect-src additionally allows the Auth (9099) and
  Firestore (8080) and Functions (5001) emulators.
  ⚠️ THE FUNCTIONS ORIGIN HAD TO BE ADDED TO THE LIVE POLICY TOO. Until the
  onboarding calls, nothing in this app ever called a Cloud Function from a
  browser — the existing ones are triggered by Firestore, server to server — so
  connect-src had never needed it. Without it every callable fails with the
  client's generic 'internal', which says nothing about a blocked request. This inline script runs before any CSP is in effect
  (only <meta charset> precedes it) and before any network request.
-->
<script>
(function () {
  var local = ['localhost', '127.0.0.1', '::1', '[::1]'].indexOf(location.hostname) !== -1;
  var emu = local
    ? ' http://localhost:8080 http://localhost:9099 http://localhost:5001 http://127.0.0.1:8080 http://127.0.0.1:9099 http://127.0.0.1:5001'
    : '';
  document.write(
    '<meta http-equiv="Content-Security-Policy" content="' +
    "default-src 'self'; " +
    "script-src 'self' https://www.gstatic.com https://www.google.com; " +
    "connect-src 'self' https://www.gstatic.com https://www.google.com https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://us-central1-bakery-app-ebf90.cloudfunctions.net" + emu + "; " +
    "frame-src 'self' https://www.google.com; " +
    "img-src 'self' data:; " +
    "style-src 'self'; " +
    "font-src 'self'; " +
    // Neither is covered by default-src, so both have to be stated. base-uri stops
    // an injected <base> from re-pointing every relative URL on the page; the app
    // has no <form> at all, so form-action 'self' can only ever refuse something
    // that should not be there.
    "base-uri 'self'; " +
    "form-action 'self'" +
    '">'
  );
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Recipe catalogue — search recipes and scale them to any dough weight in kg.">
<meta name="theme-color" content="#2D5016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Misé">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="catalogue.css">
<title>Recipe catalogue — Misé</title>
</head>
<body data-section="catalogue">
<!-- Sign-in cover. It is HERE, in the markup, so it is opaque from the first
     paint: the app must never flash a location's data at whoever is holding
     the phone. js/auth-gate.js fills it in and removes it once a location is
     open. -->
<div id="auth-gate" class="auth-gate"></div>


<!-- Three fixed tracks (left slot · title · right slot) so the title is TRULY
     centred: only one button of each slot is ever visible, and an empty slot must
     still hold its column or the title drifts off-centre. -->
<header class="cat-header">
  <span class="cat-header-slot">
    <a class="cat-icon-btn" id="catHome" href="index.html" aria-label="Back">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <button class="cat-icon-btn" id="catBack" aria-label="Back" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </span>
  <div class="cat-header-title">
    <h1 id="catTitle" data-i18n="ui.recipes">Recipes</h1>
    <p id="catSub" data-i18n="section.catalogue">Recipe catalogue</p>
  </div>
  <span class="cat-header-slot" data-help="catalogue">
    <button class="cat-icon-btn" id="catAdd" aria-label="New recipe">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="cat-icon-btn" id="catEdit" aria-label="Edit recipe" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
  </span>
</header>

<main class="cat-screen" id="catScreen"></main>

<!-- Settings. Secondary actions live at the bottom, not in the header — the app's own
     rule, and the header's two 84px slots are already full. Chrome, so it sits outside
     <main>; setHeader() hides it on every screen but the list, because a Settings
     button beside a running mixing timer is an accident waiting to be tapped.
     ⚠️ .cat-footer, NOT .recipe-footer: that class lives in style.css, which this page
     does not load, and would give an unstyled bar with no error anywhere. -->
<div class="cat-footer" id="catFooter" hidden>
  <button class="cat-footer-btn" id="catSettings" type="button">
    <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
    <span data-i18n="ui.settings">Settings</span>
  </button>
</div>

<!-- The confirm dialog is built on demand by js/catalogue/confirm-dialog.js
     (the shared .app-dialog-* component), so no static markup is needed. -->

<div class="cat-toast" id="catToast"></div>

<script type="module" src="js/i18n-dom.js"></script>
<script type="module" src="js/auth-gate.js"></script>
<script type="module" src="js/sw-update.js"></script>
<script type="module" src="js/idle-reset.js"></script>
<script type="module" src="js/catalogue/catalogue-main.js"></script>
<script type="module" src="js/help-button.js"></script>
<script type="module" src="js/hold-to-zoom.js"></script>
</body>
</html>
